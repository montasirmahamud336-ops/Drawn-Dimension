server {
    listen 80;
    server_name drawndimension.com www.drawndimension.com;
    return 301 https://www.drawndimension.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name drawndimension.com;

    ssl_certificate /etc/letsencrypt/live/drawndimension.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drawndimension.com/privkey.pem;

    return 301 https://www.drawndimension.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.drawndimension.com;

    root /var/www/vhosts/drawndimension.com/public_html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/drawndimension.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drawndimension.com/privkey.pem;

    # Enable Gzip Compression for static text, scripts, and stylesheets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = /robots.txt {
        try_files $uri =404;
    }

    location = /sitemap.xml {
        try_files $uri =404;
    }

    # Hashed static frontend bundles (Vite /assets/*)
    location ~* \.(?:css|js|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static images in public_html
    location ~* \.(?:png|jpg|jpeg|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location /media/ {
        proxy_pass https://api.drawndimension.com/media/;
        proxy_set_header Host api.drawndimension.com;
        proxy_ssl_server_name on;

        # Strip cookies to ensure Cloudflare edge CDN caches media reliably
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
