# Install as /etc/nginx/conf.d/api.drawndimension.com.conf on the VPS.
# The Node API must remain reachable only through this local reverse proxy.
server {
    listen 80;
    server_name api.drawndimension.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.drawndimension.com;

    ssl_certificate /etc/letsencrypt/live/drawndimension.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drawndimension.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 20m;

    # Defense in depth; Helmet provides the application security headers.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, rather than append, any client-supplied forwarding header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
